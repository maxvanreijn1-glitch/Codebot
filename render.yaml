services:
  - type: web
    name: codebot-server
    runtime: node
    region: oregon
    plan: starter
    # Build the React client first, then compile the Express server.
    # The server's index.ts serves the client's dist/ at runtime (production mode).
    buildCommand: >
      cd client && npm install && npm run build &&
      cd ../server && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codebot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: LOCAL_REPOS_PATH
        value: /tmp/local-repos
      - key: PR_REVIEW_REQUIRED
        value: "true"
      - key: COMMAND_TIMEOUT
        value: "30000"
      - key: SUGGESTION_DEBOUNCE
        value: "1000"

databases:
  - name: codebot-db
    databaseName: codebot
    plan: starter
    region: oregon
